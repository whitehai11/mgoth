services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mgoth-de:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data/app
      NODE_ENV: production
      ADMIN_TOKEN: public-process-disabled-administration-secret-0000
    ports:
      - "127.0.0.1:8080:3000"
    volumes:
      - ${DATA_ROOT:-./data}/app:/data/app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    pids_limit: 128
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  admin:
    image: mgoth-de:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data/app
      NODE_ENV: production
    command: ["node", "dist/server/admin.js"]
    ports:
      - "127.0.0.1:3001:3001"
    networks: [admin-private]
    volumes:
      - ${DATA_ROOT:-./data}/app:/data/app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    pids_limit: 128
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  admin-private: {}
